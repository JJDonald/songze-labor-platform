# =========================================
# 劳动平台 - Nginx 配置
# =========================================
# 用法:
#   1. 修改 server_name 为你的域名
#   2. 修改 root 指向实际的 dist 目录路径
#   3. 修改 proxy_pass 中的端口（如后端端口不是 3001）
#   4. sudo cp nginx.conf /etc/nginx/sites-available/labor-platform
#   5. sudo ln -s /etc/nginx/sites-available/labor-platform /etc/nginx/sites-enabled/
#   6. sudo nginx -t && sudo systemctl reload nginx
# =========================================

server {
    listen 80;
    # TODO: 修改为你的实际域名
    server_name example.com www.example.com;

    # 访问日志
    access_log /var/log/nginx/labor-platform-access.log;
    error_log /var/log/nginx/labor-platform-error.log;

    # 管理端媒体上传最大 200MB；成果图片接口仍由后端限制为 5MB
    client_max_body_size 200M;

    # 前端静态文件
    # TODO: 修改为实际的前端构建输出路径
    root /var/www/labor-platform/labor-platform/dist;
    index index.html;

    # 前端路由（SPA 回退）
    location / {
        try_files $uri $uri/ /index.html;

        # 缓存策略
        if ($request_uri ~* "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|eot)$") {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件静态服务
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'" always;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogv;
        }
        default_type application/octet-stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
}

# =========================================
# HTTPS 配置（使用 Certbot 自动配置后添加）
# =========================================
# certbot 会自动修改此文件并添加 443 端口配置
# 运行 sudo certbot --nginx -d example.com
#
# 手动配置 HTTPS 参考:
#
# server {
#     listen 443 ssl http2;
#     server_name example.com www.example.com;
#
#     ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#
#     # ... 其他配置同上 ...
# }
